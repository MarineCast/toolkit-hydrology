[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "marinecast-hydrology"
version = "0.1.0"
description = "Observed river conditions with explicit temporal and marine association support"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "pyarrow>=15", "requests>=2.31", "numpy>=1.26", "shapely>=2", "pyproj>=3.6", "h3>=4"]
[project.optional-dependencies]
test = ["pytest>=8", "build"]
[project.scripts]
hydrology = "hydrology.cli:main"
[tool.setuptools.package-data]
hydrology = ["data/*.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: explicit network integration"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
